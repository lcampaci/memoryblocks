<title>Memory Blocks</title>
<style>
/* Layout: a Windows 3.1 window on a teal desktop; the board canvas sits above a white score strip, as in the 1991 original. */
:root{
  --desk:#008080; --face:#c0c0c0; --hi:#ffffff; --shade:#808080; --dark:#000000;
  --title:#000080; --title-fg:#ffffff; --ink:#000000; --paper:#ffffff;
  --cyan:#00ffff; --yellow:#ffff00; --olive:#c0c000;
  --ui:"MS Sans Serif","Segoe UI",Tahoma,Arial,Helvetica,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}body{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:13px/1.25 var(--ui);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px;overflow-x:hidden}
#stage{width:100%;display:flex;justify-content:center;min-width:0}
.win{background:var(--face);border:1px solid var(--dark);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shade),3px 3px 0 rgba(0,0,0,.35);padding:3px;max-width:100%;position:relative}
.titlebar{background:var(--title);color:var(--title-fg);font-weight:700;padding:2px 6px;display:flex;align-items:center;gap:8px;height:20px;user-select:none}
.titlebar span{flex:1;text-align:center}
.menubar{background:var(--paper);display:flex;border-bottom:1px solid var(--dark);position:relative;user-select:none}
.menubar>button{all:unset;padding:2px 9px;cursor:default}
.menubar>button:hover,.menubar>button.open{background:var(--title);color:var(--title-fg)}
.menubar>button:focus-visible{outline:1px dotted currentColor;outline-offset:-3px}
.dropdown{position:absolute;top:100%;background:var(--paper);border:1px solid var(--dark);box-shadow:2px 2px 0 rgba(0,0,0,.4);min-width:190px;z-index:20;padding:2px 0}
.dropdown[hidden]{display:none}
.dropdown .it{display:flex;justify-content:space-between;gap:24px;padding:2px 14px 2px 22px;position:relative;cursor:default;white-space:nowrap}
.dropdown .it:hover{background:var(--title);color:var(--title-fg)}
.dropdown .it.chk::before{content:"\2713";position:absolute;left:6px}
.dropdown .it.sub::after{content:"\25B8";position:absolute;right:5px}
.dropdown hr{border:0;border-top:1px solid var(--shade);margin:3px 0}
.dropdown .subm{position:absolute;left:100%;top:-3px;display:none}
.dropdown .it.sub:hover>.subm{display:block}
.client{border:1px solid var(--shade);border-right-color:var(--hi);border-bottom-color:var(--hi);background:var(--cyan);line-height:0}
canvas{display:block;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
.note{color:#e8ffff;font-size:12px;max-width:62ch;text-align:center;line-height:1.45}
.note b{font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:30;padding:8px}
.dlg{background:var(--face);border:1px solid var(--dark);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shade),4px 4px 0 rgba(0,0,0,.4);padding:3px;max-width:100%;max-height:100%;display:flex;flex-direction:column}
.dlg .titlebar{height:18px}
.dlg .body{padding:12px 14px;overflow:auto;min-height:0}
.dlg pre{font:13px/1.35 var(--ui);white-space:pre-wrap;margin:0;max-width:52ch}
.btns{display:flex;gap:12px;justify-content:center;padding:4px 14px 12px}
.btn{all:unset;background:var(--face);border:1px solid var(--dark);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--shade);padding:3px 16px;min-width:72px;text-align:center;cursor:default}
.btn:active{box-shadow:inset 1px 1px 0 var(--shade)}
.btn.def{outline:2px solid var(--dark);outline-offset:-1px}
.btn:focus-visible{outline:1px dotted var(--dark);outline-offset:-4px}
.field{all:unset;display:block;box-sizing:border-box;width:100%;background:var(--paper);border:1px solid var(--shade);border-right-color:var(--hi);border-bottom-color:var(--hi);box-shadow:inset 1px 1px 0 var(--dark);padding:2px 4px;margin-top:8px}
.hs{display:grid;grid-template-columns:2ch minmax(70px,1fr) auto auto auto;column-gap:8px;row-gap:1px;background:var(--paper);border:1px solid var(--shade);padding:6px 8px;margin-top:2px;font-variant-numeric:tabular-nums;min-width:min(500px,84vw)}
.hs .num{text-align:right}
.hs .hd{grid-column:1/-1;text-align:center;font-weight:700;padding-bottom:2px}
.hs .c3,.hs .c4,.hs .c5{text-align:right;white-space:nowrap}
.tabs{width:min(520px,78vw)}
.tabbar{display:flex;gap:2px;padding-left:6px;margin-bottom:-1px;position:relative;z-index:1}
.tabbar button{all:unset;padding:3px 14px;background:var(--face);border:1px solid var(--dark);border-bottom:0;box-shadow:inset 1px 1px 0 var(--hi);cursor:default;position:relative;top:2px}
.tabbar button.on{top:0;padding-bottom:5px;font-weight:700}
.tabbar button:focus-visible{outline:1px dotted var(--dark);outline-offset:-4px}
.pane{background:var(--paper);border:1px solid var(--dark);padding:10px 12px;max-height:52vh;overflow:auto;line-height:1.45}
.pane p{margin:0 0 .7em}.pane h3{font-size:13px;margin:0 0 .5em}.pane dl{margin:0 0 .7em;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.pane dt{font-weight:700}.pane dd{margin:0}
.pane a{color:#0000a8}
.gone{display:flex;align-items:center;justify-content:center;min-height:120px}
.sr{position:absolute;left:-9999px}
@media (max-width:420px){.dropdown{min-width:160px}.menubar>button{padding:2px 6px}}
@media (display-mode:standalone),(max-height:720px){.note{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

const TEXT={"help1": "Bem-vindo ao Memory Blocks (para um jogador) !\r\rOs blocos são embaralhados e dispostos ao acaso, com a face da figura voltada para baixo.\r\rVire qualquer bloco clicando nele com o mouse. Se a figura for idêntica à do bloco virado em seguida, os dois desaparecem. Se as figuras não forem idênticas, os blocos são virados de novo, com a figura para baixo.\r\rContinue virando os blocos até que todos os pares tenham sido encontrados e não sobre nenhum bloco.\r\rVocê é avaliado de duas maneiras. Primeiro, pelo tempo total, em segundos, que levou para encontrar todos os pares correspondentes. Segundo, pelo número total de pares virados até que todos os blocos tenham desaparecido. Os melhores resultados entram na lista de recordes.\r\rBoa sorte !", "help2": "Bem-vindo ao Memory Blocks (para dois jogadores) !\r\rOs blocos são embaralhados e dispostos ao acaso, com a face da figura voltada para baixo. Os jogadores se revezam virando os blocos (dois por vez).\r\rSe as figuras dos blocos virados por um jogador não forem idênticas, os blocos são virados de novo, com a figura para baixo, e passa a ser a vez do segundo jogador.\r\rSe as figuras forem idênticas, os dois blocos desaparecem e o jogador ganha um “acerto”. O mesmo jogador joga novamente e continua até virar um par diferente.\r\rO jogo termina quando todos os pares tiverem sido encontrados e não restarem mais blocos. Vence o jogador com mais acertos.\r\rDivirta-se jogando !", "about": "          SYMANTEC GAME PACK\r\r                  Memory Blocks\r                     Versão 1.00\r\rCopyright © 1991 Charles Timmerman\r\rEsta versão para navegador é uma homenagem não oficial.", "menu": {"t1": "&Jogo", "t2": "&Nível", "t3": "Aj&uda", "t4": "&Sobre o jogo", "neu": "&Novo", "p1": "&1 Jogador", "p2": "&2 Jogadores", "hs": "&Melhores resultados", "klein": "Tabuleiro &pequeno", "gross": "Tabuleiro &grande", "farbe": "&Cores", "quit": "&Sair", "h1": "Instruções &1 Jogador...", "h2": "Instruções &2 Jogadores...", "about": "&Sobre o Memory Blocks..."}, "strip": {"zeit": "Tempo: ", "zug": "Pares virados:", "paare": "Pares encontrados:", "sp1": "Pares Jogador 1:", "sp2": "Pares Jogador 2:"}, "name": {"title": "Memory Blocks", "g": "Parabéns!", "a": "Você obteve um dos melhores resultados.", "b": "Digite seu nome...", "def": "Desconhecido"}, "hs": {"zeit": "Melhor tempo", "paare": "Pares virados", "sek": "segundos", "pg": "pares no total", "tBig": "Resultado – tabuleiro grande", "tSmall": "Resultado – tabuleiro pequeno", "reset": "&Zerar pontuação"}, "sobre": {"title": "Sobre o jogo", "t1": "História", "t2": "Homenagem", "h1": "<h3>Memory Blocks</h3>\n<dl><dt>Autor</dt><dd>Charles Timmerman. O aviso gravado dentro do executável diz “Copyright © 1991 Charles Timmerman”.</dd>\n<dt>Ano</dt><dd>1991. O arquivo <code>BLOCKS.EXE</code> usado como referência tem data de arquivo de 12/12/1991.</dd>\n<dt>Pacote</dt><dd>Symantec Game Pack, coletânea de seis jogos para Windows 3.x: Jacks, Hangman, Smart Dots, Memory Blocks, Pick Up Sticks e Code Breaker.</dd>\n<dt>Versão</dt><dd>1.00 (cópia analisada em alemão).</dd></dl>\n<p>É um jogo da memória para um ou dois jogadores. Os blocos ficam com a face para baixo e você os vira dois a dois para achar pares de figuras. São 32 figuras, tabuleiros de 6×5 e 10×6 blocos, e o placar guarda os cinco melhores resultados por tempo e por número de pares virados.</p>\n<p>O programa é um executável de 16 bits do Windows 3.x, de cerca de 64 KB. O arquivo ainda guarda o texto de um sorteio promocional da Symantec (“Symantec Game Pack Sweepstakes”), que não faz parte do jogo e não foi incluído aqui.</p>\n<p>Detalhes além disso, como a história do desenvolvimento ou a biografia do autor, não constam no executável nem nas fontes consultadas, e por isso não estão aqui.</p>\n<p>Fontes: <a href=\"https://www.mobygames.com/game/47962/symantec-game-pack/\" target=\"_blank\" rel=\"noopener\">MobyGames</a>, <a href=\"https://winworldpc.com/product/symantec-game-pack\" target=\"_blank\" rel=\"noopener\">WinWorld</a> e o próprio <code>BLOCKS.EXE</code>.</p>", "h2": "<h3>Uma homenagem</h3>\n<p>Esta versão para navegador é uma <b>homenagem de fã</b>, feita sem fins comerciais e para <b>uso exclusivamente pessoal</b>.</p>\n<p>Não é um produto da Symantec nem de Charles Timmerman, e não tem vínculo com eles nem aprovação deles. Memory Blocks, Symantec Game Pack, as figuras e os textos originais pertencem aos seus respectivos titulares.</p>\n<p>O código desta versão foi escrito do zero. As regras, os tabuleiros, a pontuação e as animações foram reconstruídos observando o comportamento do <code>BLOCKS.EXE</code> original. Por favor, não redistribua.</p>\n<p>Obrigado, Charles Timmerman, pelas partidas de 1991.</p>"}};

/* ---------- persistence (SYMGAMES.INI equivalent) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem("memoryblocks."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("memoryblocks."+k,JSON.stringify(v))}catch(e){}}
};
const emptyHS=()=>({big:{A:[],B:[]},small:{A:[],B:[]}});
const loadedHS=store.get("hs",emptyHS());
for(const size of ["small","big"])for(const cat of ["A","B"]){
  if(!loadedHS[size])loadedHS[size]={A:[],B:[]};
  if(!Array.isArray(loadedHS[size][cat]))loadedHS[size][cat]=[];
  loadedHS[size][cat]=loadedHS[size][cat].map(e=>{
    if(!e||typeof e!=="object")return e;
    // Previous releases stored whole seconds and did not store a completion date.
    const upgraded={...e};
    if(!Number.isInteger(upgraded.ms)){
      upgraded.ms=Math.max(0,Math.round(Number(upgraded.t)||0))*1000;
    }
    if(!upgraded.date)upgraded.date=null;
    return upgraded;
  });
}
const S={
  board:store.get("board","small"), players:store.get("players",1), color:store.get("color",true),
  hs:loadedHS, lastName:(n=>n==="Unbekannt"?TEXT.name.def:n)(store.get("name",TEXT.name.def))

/* ---------- game state ---------- */
let G=null, gameId=0, tick=null;
function newGame(){
  gameId++;
  const tall=innerHeight>innerWidth*1.15; // portrait screens get the board turned (6x10 / 5x6)
  const cols=tall?ROWS[S.board]:COLS[S.board], rows=tall?COLS[S.board]:ROWS[S.board], n=cols*rows, pairs=n/2;
  const perm=[...Array(32).keys()]; shuffle(perm);
  const slots=[...Array(n).keys()]; shuffle(slots);
  const cells=Array(n);
  for(let k=0;k<pairs;k++){cells[slots[2*k]]={state:0,pic:perm[k],pair:k};cells[slots[2*k+1]]={state:0,pic:perm[k],pair:k}}
  G={tall,cols,rows,n,pairs,cells,first:-1,second:-1,player:1,score:[0,0],turns:0,matches:0,start:null,final:null,over:false,busy:false,queue:[],ov:new Map(),hidden:null,flash:0};
  layout(); startTick(); draw();
  deal(gameId);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- animation: the original draws pre-rendered cube frames, one every 50 ms ---------- */
// override kinds: {f:n}=plain cube keyframe n, {f:4,pic:true}=cube with its picture, {s:n}=shrink frame n (with picture), {gone:1}=blank
async function steps(list,id){ // list of arrays of [tile, override]
  for(const st of list){
    if(id!==gameId)return;
    for(const [i,o] of st)G.ov.set(i,o);
    draw(); await sleep(FRAME);
  }
  if(id!==gameId)return;
  for(const st of list)for(const [i] of st)G.ov.delete(i);
  draw();
}
const upSeq=i=>[[i,{f:1}],[i,{f:2}],[i,{f:3}],[i,{f:4,pic:1}]];
const downSeq=i=>[[i,{f:3}],[i,{f:2}],[i,{f:1}],[i,{f:0}]];
function zip(...seqs){return seqs[0].map((_,k)=>seqs.map(s=>s[k]))}
const flipUp=(i,id)=>steps(upSeq(i).map(x=>[x]),id);
const flipDown=(is,id)=>steps(zip(...is.map(downSeq)),id);
async function deal(id){ // 0x201a: tiles turn into place in random order, three keyframes each (2,1,0)
  G.busy=true; G.hidden=new Set([...Array(G.n).keys()]);
  const stage=Array(G.n).fill(0); let left=G.n*3; const dt=G.n>40?7:12;
  while(left>0){
    if(id!==gameId)return;
    let i=Math.floor(Math.random()*G.n); while(stage[i]===3)i=(i+1)%G.n;
    stage[i]++; left--;
    G.hidden.delete(i);
    if(stage[i]===3)G.ov.delete(i); else G.ov.set(i,{f:stage[i]===1?2:1});
    draw(); await sleep(dt);
  }
  if(id!==gameId)return;
  G.hidden=null; G.busy=false; draw(); drain();
}

/* ---------- input & rules (state machine recovered from BLOCKS.EXE) ---------- */
function drain(){ if(G.busy||!G.queue.length)return; const p=G.queue.shift(); handleClick(p.x,p.y) }
function handleClick(x,y){
  if(!G)return;
  if(G.busy){ if(G.queue.length<2)G.queue.push({x,y}); return }
  if(G.over&&G.players===1)return;
  if(S.players===1&&G.start===null&&G.matches<G.pairs)G.start=performance.now(); // timer starts on the first click
  const i=hit(x,y); if(i<0)return;
  onTile(i);
}
function hit(x,y){
  const lx=x/LAY.s, ly=y/LAY.s;
  if(lx<MX||ly<MY)return -1;
  const c=Math.floor((lx-MX)/PITCH), r=Math.floor((ly-MY)/PITCH);
  if(c<0||r<0||c>=G.cols||r>=G.rows)return -1;
  if(lx-MX-c*PITCH>=TW)return -1;
  return r*G.cols+c;
}
async function onTile(i){
  const id=gameId, c=G.cells[i]; if(c.state===2)return;
  G.busy=true;
  try{
    if(G.second!==-1){
      if(i===G.first){ const s=G.second; G.cells[s].state=0; G.second=-1; await flipDown([s],id) }
      else if(i===G.second){ const f=G.first; G.cells[f].state=0; G.first=i; G.second=-1; await flipDown([f],id) }
      else { const f=G.first,s=G.second; c.state=1; G.cells[f].state=0; G.cells[s].state=0; G.first=i; G.second=-1;
        await steps(zip(downSeq(f),downSeq(s),upSeq(i)),id) }
    } else if(G.first===-1){
      c.state=1; G.first=i; await flipUp(i,id)
    } else if(i===G.first){
      /* same tile: nothing */
    } else if(G.cells[G.first].pic!==c.pic){
      c.state=1; G.second=i; await flipUp(i,id); if(id!==gameId)return; turn(false,id)
    } else {
      c.state=1; await flipUp(i,id); await sleep(200); if(id!==gameId)return;
      const f=G.first; G.cells[f].state=2; c.state=2; G.first=-1; G.second=-1;
      await steps([...SHRINK.map((_,k)=>[[f,{s:k}],[i,{s:k}]]),[[f,{gone:1}],[i,{gone:1}]]],id); if(id!==gameId)return;
      await turn(true,id)
    }
  } finally { if(id===gameId){G.busy=false; draw(); drain()} }
}
async function turn(match,id){
  if(S.players===1){
    G.turns++; if(match)G.matches++;
    if(G.matches===G.pairs){ G.final=Math.max(0,Math.round(performance.now()-G.start)); G.over=true; draw(); await finishSingle(id) }
  } else {
    if(match)G.score[G.player-1]++; else G.player=G.player===1?2:1;
    G.matches+=match?1:0;
    if(G.score[0]+G.score[1]===G.pairs){G.over=true}
  }
  draw();
}
const elapsed=()=>G.final!==null?G.final:(G.start===null?0:Math.max(0,Math.round(performance.now()-G.start)));
function formatTime(ms){
  ms=Math.max(0,Math.floor(ms));
  const minutes=Math.floor(ms/60000), seconds=Math.floor(ms/1000)%60, millis=ms%1000;
  return String(minutes).padStart(2,"0")+":"+String(seconds).padStart(2,"0")+"."+String(millis).padStart(3,"0");
}
function completionDate(){
  const d=new Date();
  return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

/* ---------- high scores (0x5b7 / 0x804 / 0x7db) ---------- */
function slotFor(list,key){ // ties rank below existing entries
  for(let k=0;k<5;k++){
    const e=list[k]; if(!e)return k;
    const value=e.ms??((Number(e[key[0]])||0)*1000);
    if(!(value<key[1][0]||(value===key[1][0]&&e[key[2]]<=key[1][1])))return k;
  }
  return -1;
}
async function finishSingle(id){
  const t=G.final,p=G.turns,tb=S.hs[S.board];
  const sa=slotFor(tb.A,["ms",[t,p],"p"]), sb=slotFor(tb.B,["p",[p,t],"ms"]);
  if(sa<0&&sb<0)return;
  const name=await nameDialog(); if(id!==gameId)return;
  const e={t,p,n:name,ms:t,date:completionDate()};
  if(sa>=0){tb.A.splice(sa,0,{...e});tb.A.length=Math.min(5,tb.A.length)}
  if(sb>=0){tb.B.splice(sb,0,{...e});tb.B.length=Math.min(5,tb.B.length)}
  S.lastName=name;store.set("name",name);store.set("hs",S.hs);
  await showScores(S.board);
}

const stage=document.getElementById("stage");
stage.innerHTML=`
<div class="win" id="win">

</div>`;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let LAY={s:.4,bw:300,bh:200};
function layout(){
  if(!G)return;
  const W=PITCH*G.cols+MX, H=PITCH*G.rows+MY+MB;
  const win=document.getElementById("win"), note=document.querySelector(".note");
  const chrome=win.offsetHeight-cv.offsetHeight;               // title bar, menu bar, borders
  const noteH=note&&note.offsetParent?note.offsetHeight+12:0;
  const avail=Math.min(window.innerWidth-32-14, 1800);
  const availH=window.innerHeight-chrome-noteH-32-STRIP-6;
  const s=Math.max(0.1,Math.min(avail/W, availH/H, 1.4));
  LAY={s,W,H,bw:Math.round(W*s),bh:Math.round(H*s)};
  const dpr=window.devicePixelRatio||1;
  cv.style.width=LAY.bw+"px"; cv.style.height=(LAY.bh+STRIP)+"px";
  cv.width=Math.round(LAY.bw*dpr); cv.height=Math.round((LAY.bh+STRIP)*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function cellOrigin(i){const c=i%G.cols,r=Math.floor(i/G.cols);return[(MX+c*PITCH)*LAY.s,(MY+r*PITCH)*LAY.s]}
function poly(p,fill){
  ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let k=1;k<4;k++)ctx.lineTo(p[k][0],p[k][1]);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.stroke();
}
function drawCube(faces,pic){ // faces: [left,bottom,front] in cell units; ctx already scaled
  const side=S.color?"#c0c000":"#ffffff", front=S.color?"#ffff00":"#ffffff";
  poly(faces[0],side);poly(faces[1],side);
  if(pic===null){poly(faces[2],front);return}
  poly(faces[2],front);
  const xs=faces[2].map(q=>q[0]),ys=faces[2].map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const im=sheets[S.color?"color":"mono"];
  if(im.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(im,(pic%8)*48,Math.floor(pic/8)*36,48,36,x0,y0,x1-x0,y1-y0)}
  ctx.strokeRect(x0,y0,x1-x0,y1-y0);
}
function draw(){
  if(!G||!ctx)return;
  ctx.fillStyle=S.color?"#00ffff":"#ffffff";ctx.fillRect(0,0,LAY.bw,LAY.bh);
  for(let i=0;i<G.n;i++){
    const c=G.cells[i]; let o=G.ov.get(i);
    if(!o){ if(G.hidden&&G.hidden.has(i))continue; if(c.state===2)continue; o=c.state===1?{f:4,pic:1}:{f:0} }
    if(o.gone)continue;
    const [ox,oy]=cellOrigin(i);
    ctx.save();ctx.translate(ox,oy);ctx.scale(LAY.s,LAY.s);ctx.lineWidth=1/LAY.s;ctx.strokeStyle="#000";
    if(o.s!==undefined)drawCube(SHRINK[o.s],c.pic);
    else drawCube(CUBE[o.f],o.pic?c.pic:null);
    ctx.restore();
  }
  drawStrip();
}
function drawStrip(){
  const y=LAY.bh, w=LAY.bw, fam=getComputedStyle(document.body).fontFamily;
  // game over: the strip flashes between two colour pairs every 500 ms (palette rotation in the original)
  const pairs=S.color?[["#ff00ff","#ffff00"],["#ffff00","#ff00ff"]]:[["#000000","#ffffff"],["#ffffff","#000000"]];
  const over=G.over, [fg,bg]=over?pairs[G.flash%2]:["#000000","#ffffff"];
  ctx.fillStyle=bg;ctx.fillRect(0,y,w,STRIP);
  ctx.fillStyle="#000";ctx.fillRect(0,y,w,1);
  ctx.textBaseline="middle";const ty=y+STRIP/2+1;
  if(S.players===1){
    const txt=TEXT.strip.zeit+formatTime(elapsed())+"   "+TEXT.strip.zug+" "+G.turns+"     "+TEXT.strip.paare+" "+G.matches;
    ctx.font="15px "+fam;
    let s=txt; if(ctx.measureText(s).width>w-16){s=TEXT.strip.zeit+formatTime(elapsed())+"   "+G.turns+" / "+G.matches}
    ctx.fillStyle=fg;ctx.textAlign="right";ctx.fillText(s,w-9,ty);
  } else {
    ctx.font="15px "+fam;
    for(const pl of [1,2]){
      const label=TEXT.strip["sp"+pl]+" "+G.score[pl-1];
      ctx.fillStyle=over?fg:(G.player===pl?"#000000":"#808080");
      ctx.textAlign=pl===1?"left":"right";ctx.fillText(label,pl===1?9:w-9,ty);
    }
  }
}
function startTick(){clearInterval(tick);tick=setInterval(()=>{ if(!G)return;
  if(G.over){G.flash++;draw()} else if(S.players===1&&G.start!==null)draw() },16)}

  const r=cv.getBoundingClientRect();

{const b=document.createElement("button");b.innerHTML=mnem(MENU.t4);b.onclick=e=>{e.stopPropagation();close();act("sobre")};b.onmouseenter=()=>{if(openMenu)close()};bar.append(b)}

let modal=null;
function dialog(title,bodyEl,buttons){
  return new Promise(resolve=>{
    const scrim=document.createElement("div");scrim.className="scrim";
    const d=document.createElement("div");d.className="dlg";d.setAttribute("role","dialog");d.setAttribute("aria-label",title);
    d.innerHTML=`<div class="titlebar"><span>${title}</span></div>`;
    const body=document.createElement("div");body.className="body";body.append(bodyEl);d.append(body);
    const row=document.createElement("div");row.className="btns";
    const done=v=>{scrim.remove();modal=null;document.removeEventListener("keydown",key,true);resolve(v)};
    let defBtn=null;
    for(const b of buttons){
      const el=document.createElement("button");el.className="btn"+(b.def?" def":"");el.innerHTML=mnem(b.label);
      el.onclick=()=>{const r=b.onclick?b.onclick(done):done(b.value);};
      row.append(el);if(b.def)defBtn=el;
    }
    d.append(row);scrim.append(d);document.getElementById("win").append(scrim);modal=scrim;
    const key=e=>{if(e.key==="Escape"||e.key==="Enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();e.stopPropagation();if(defBtn)defBtn.click()}};
    document.addEventListener("keydown",key,true);
    (body.querySelector("input")||defBtn).focus();
  });
}

    for(const [key,head] of [["A",TEXT.hs.zeit],["B",TEXT.hs.paare]]){
      const g=document.createElement("div");g.className="hs";g.innerHTML=`<div class="hd">${head}</div>`;
      for(let k=0;k<5;k++){const e=tb[key][k];
        g.insertAdjacentHTML("beforeend",`<span class="num">${k+1}.</span><span>${e?esc(e.n):""}</span><span class="c3">${e?formatTime(e.ms??(e.t||0)*1000):""}</span><span class="c4">${e?e.p+" "+TEXT.hs.pg:""}</span><span class="c5">${e?esc(e.date||"—"):""}</span>`)}
      root.append(g);
    }
  };
  render();
  return dialog(board==="big"?TEXT.hs.tBig:TEXT.hs.tSmall,root,[
    {label:"OK",def:true,value:true},
    {label:TEXT.hs.reset,onclick:()=>{S.hs[board]={A:[],B:[]};store.set("hs",S.hs);render()}}
  ]);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

newGame();
</script>
